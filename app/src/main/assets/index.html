<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>FLIGHT//LUX</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #05070b;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        overflow-x: hidden;
    }

    .app {
        min-height: 100vh;
        padding-bottom: 40px;
        background:
            radial-gradient(circle at 50% -10%, #183c58 0%, #08111b 35%, #05070b 70%);
    }

    header {
        padding: 28px 20px 18px;
        text-align: center;
    }

    .logo {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 3px;
    }

    .logo span {
        color: #38bdf8;
    }

    .subtitle {
        margin-top: 7px;
        color: #8da2b5;
        font-size: 13px;
        letter-spacing: 1px;
    }

    .panel {
        margin: 12px;
        padding: 18px;
        border-radius: 22px;
        background: rgba(12, 20, 29, .94);
        border: 1px solid rgba(255,255,255,.08);
        box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }

    .trip-buttons {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
    }

    .trip-button {
        flex: 1;
        padding: 11px 5px;
        border: 1px solid #263746;
        border-radius: 12px;
        background: #0d1721;
        color: #9db0c0;
        font-weight: bold;
    }

    .trip-button.active {
        background: #0ea5e9;
        color: #001018;
        border-color: #38bdf8;
    }

    label {
        display: block;
        margin: 13px 0 6px;
        color: #8da2b5;
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    input, select {
        width: 100%;
        height: 52px;
        padding: 0 14px;
        border: 1px solid #263746;
        border-radius: 14px;
        outline: none;
        background: #09131d;
        color: white;
        font-size: 16px;
    }

    input:focus, select:focus {
        border-color: #38bdf8;
    }

    .row {
        display: flex;
        gap: 10px;
    }

    .row > div {
        flex: 1;
    }

    .search-button {
        width: 100%;
        height: 56px;
        margin-top: 18px;
        border: 0;
        border-radius: 16px;
        background: linear-gradient(135deg, #38bdf8, #0ea5e9);
        color: #001018;
        font-size: 17px;
        font-weight: 900;
        letter-spacing: .5px;
        box-shadow: 0 8px 25px rgba(14,165,233,.25);
    }

    .search-button:active {
        transform: scale(.98);
    }

    .status {
        display: none;
        margin: 14px 0 0;
        padding: 12px;
        border-radius: 12px;
        background: #0a1822;
        color: #8ddcff;
        text-align: center;
        font-size: 13px;
    }

    .results {
        margin-top: 18px;
    }

    .results-title {
        margin: 0 0 10px;
        color: #9db0c0;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .flight {
        margin-bottom: 10px;
        padding: 15px;
        border-radius: 16px;
        background: #0a131d;
        border: 1px solid #1c2b38;
    }

    .flight-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .airline {
        font-weight: bold;
    }

    .price {
        color: #38bdf8;
        font-size: 20px;
        font-weight: 900;
    }

    .route {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 13px;
    }

    .airport {
        font-size: 22px;
        font-weight: 900;
    }

    .arrow {
        color: #38bdf8;
        font-size: 20px;
    }

    .details {
        margin-top: 9px;
        color: #7f94a5;
        font-size: 12px;
    }

    .badge {
        display: inline-block;
        margin-top: 9px;
        padding: 5px 8px;
        border-radius: 7px;
        background: #123225;
        color: #6ee7a8;
        font-size: 11px;
        font-weight: bold;
    }

    .empty {
        padding: 25px 10px;
        text-align: center;
        color: #6f8495;
        font-size: 14px;
    }

    footer {
        padding: 10px 20px;
        text-align: center;
        color: #4e6475;
        font-size: 11px;
    }

    .pulse {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 5px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 10px #22c55e;
    }
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">FLIGHT<span>//</span>LUX</div>
    <div class="subtitle">BUSCADOR DE VUELOS</div>
</header>

<section class="panel">

    <div class="trip-buttons">
        <button class="trip-button active" onclick="setTrip('round', this)">
            IDA Y VUELTA
        </button>

        <button class="trip-button" onclick="setTrip('oneway', this)">
            SOLO IDA
        </button>
    </div>

    <label>Origen</label>
    <input id="origin"
           type="text"
           placeholder="Ej. MEX"
           autocomplete="off">

    <label>Destino</label>
    <input id="destination"
           type="text"
           placeholder="Ej. CUN"
           autocomplete="off">

    <div class="row">

        <div>
            <label>Salida</label>
            <input id="departure" type="date">
        </div>

        <div id="returnBox">
            <label>Regreso</label>
            <input id="returnDate" type="date">
        </div>

    </div>

    <label>Pasajeros</label>
    <select id="passengers">
        <option value="1">1 pasajero</option>
        <option value="2">2 pasajeros</option>
        <option value="3">3 pasajeros</option>
        <option value="4">4 pasajeros</option>
        <option value="5">5 pasajeros</option>
        <option value="6">6 pasajeros</option>
    </select>

    <button class="search-button" onclick="searchFlights()">
        ✈ BUSCAR VUELOS
    </button>

    <div id="status" class="status"></div>

    <div id="results" class="results">
        <div class="empty">
            Introduce origen y destino para comenzar.
        </div>
    </div>

</section>

<footer>
    <span class="pulse"></span>
    FLIGHT//LUX listo
</footer>

</div>

<script>
let tripType = "round";

function setTrip(type, button) {
    tripType = type;

    document.querySelectorAll(".trip-button")
        .forEach(function(btn) {
            btn.classList.remove("active");
        });

    button.classList.add("active");

    const returnBox = document.getElementById("returnBox");

    if (type === "oneway") {
        returnBox.style.display = "none";
    } else {
        returnBox.style.display = "block";
    }
}

function cleanCode(value) {
    return value
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "")
        .substring(0, 4);
}

function searchFlights() {

    const origin = cleanCode(
        document.getElementById("origin").value
    );

    const destination = cleanCode(
        document.getElementById("destination").value
    );

    const departure =
        document.getElementById("departure").value;

    const returnDate =
        document.getElementById("returnDate").value;

    const passengers =
        document.getElementById("passengers").value;

    const status =
        document.getElementById("status");

    const results =
        document.getElementById("results");

    if (!origin || !destination) {
        status.style.display = "block";
        status.textContent =
            "⚠ Escribe el origen y destino.";
        return;
    }

    if (!departure) {
        status.style.display = "block";
        status.textContent =
            "⚠ Selecciona la fecha de salida.";
        return;
    }

    if (tripType === "round" && !returnDate) {
        status.style.display = "block";
        status.textContent =
            "⚠ Selecciona la fecha de regreso.";
        return;
    }

    status.style.display = "block";
    status.textContent =
        "⌛ Buscando las mejores opciones...";

    results.innerHTML = "";

    setTimeout(function() {

        status.textContent =
            "✓ Búsqueda completada";

        results.innerHTML = `
            <div class="results-title">
                RESULTADOS
            </div>

            <div class="flight">

                <div class="flight-top">
                    <div class="airline">
                        FLIGHT//LUX
                    </div>

                    <div class="price">
                        $2,499 MXN
                    </div>
                </div>

                <div class="route">

                    <div class="airport">
                        ${origin}
                    </div>

                    <div class="arrow">
                        ✈
                    </div>

                    <div class="airport">
                        ${destination}
                    </div>

                </div>

                <div class="details">
                    ${departure}
                    · ${passengers} pasajero(s)
                    · Vuelo directo
                </div>

                <div class="badge">
                    MEJOR PRECIO
                </div>

            </div>

            <div class="flight">

                <div class="flight-top">
                    <div class="airline">
                        FLIGHT//LUX FLEX
                    </div>

                    <div class="price">
                        $3,199 MXN
                    </div>
                </div>

                <div class="route">

                    <div class="airport">
                        ${origin}
                    </div>

                    <div class="arrow">
                        ✈
                    </div>

                    <div class="airport">
                        ${destination}
                    </div>

                </div>

                <div class="details">
                    ${departure}
                    · ${passengers} pasajero(s)
                    · Equipaje incluido
                </div>

                <div class="badge">
                    FLEXIBLE
                </div>

            </div>
        `;

    }, 700);
}

document.addEventListener("DOMContentLoaded", function() {

    const today = new Date()
        .toISOString()
        .split("T")[0];

    document.getElementById("departure").min = today;
    document.getElementById("returnDate").min = today;

    document.getElementById("departure")
        .addEventListener("change", function() {
            document.getElementById("returnDate").min =
                this.value;
        });

});
</script>

</body>
  </html>
